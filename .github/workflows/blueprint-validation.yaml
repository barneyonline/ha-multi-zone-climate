---
name: Validate Home Assistant blueprints

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'blueprints/**/*.yaml'
      - 'blueprints/**/*.yml'
      - 'scripts/**/*.py'
      - 'tests/**'
      - '.github/workflows/blueprint-validation.yaml'
  push:
    branches:
      - main
    paths:
      - 'blueprints/**/*.yaml'
      - 'blueprints/**/*.yml'
      - 'scripts/**/*.py'
      - 'tests/**'
      - '.github/workflows/blueprint-validation.yaml'

jobs:
  blueprint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Home Assistant Core
        env:
          HA_VERSION: '2025.6.0'
          HA_CONSTRAINTS: 'https://raw.githubusercontent.com/home-assistant/core/2025.6.0/homeassistant/package_constraints.txt'
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint "${HA_CONSTRAINTS}" \
            "homeassistant==${HA_VERSION}"
          python - <<'PY'
          from importlib.metadata import version
          import sys
          print("HA OK", version("homeassistant"), sys.version)
          PY

      - name: Validate blueprints
        run: |
          mapfile -d '' BLUEPRINT_FILES < <(
            find blueprints -type f \( -name '*.yaml' -o -name '*.yml' \) -print0
          )
          python scripts/ha_blueprint_validate.py "${BLUEPRINT_FILES[@]}"

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
