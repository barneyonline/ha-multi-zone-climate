blueprint:
  name: Climate Change Classifier (Schedule vs Manual)
  description: >
    Classifies target-temperature, HVAC mode, and damper changes as
    automation-originated or manual. Automation and script service calls open a
    short guard only when they target a monitored entity; the companion schedule
    also emits an explicit marker before root-context time-triggered writes. Home
    Assistant UI/app changes are confirmed from user-context state changes, while
    HomeKit and physical-device changes are confirmed after a short settle delay.
    Parallel execution absorbs service-call and state-change bursts.
  domain: automation
  source_url: https://github.com/barneyonline/ha-multi-zone-climate/blob/main/blueprints/automation/climate_change_classifier.yaml

  input:
    head_unit:
      name: Climate Head-Unit
      description: Shared climate entity whose HVAC mode is monitored.
      selector:
        entity:
          domain: climate

    monitored_climate_entities:
      name: Climate Entities to Monitor
      description: Climate entities whose target temperature changes should be classified. Include the head-unit and any per-zone climate entities.
      selector:
        entity:
          domain: climate
          multiple: true

    damper_switches:
      name: Damper Switches to Monitor
      description: Damper switch entities whose on/off changes should be classified.
      selector:
        entity:
          domain: switch
          multiple: true

    schedule_guard_flag:
      name: Schedule Guard Flag
      description: Input boolean turned on while monitored automation or script changes are settling.
      selector:
        entity:
          domain: input_boolean

    schedule_guard_timer:
      name: Schedule Guard Timer
      description: Timer kept active while schedule-originated climate changes are expected to settle.
      selector:
        entity:
          domain: timer

    manual_override:
      name: Manual Override Flag
      description: Input boolean turned on when this classifier detects a manual climate or damper change.
      selector:
        entity:
          domain: input_boolean

    schedule_hold_seconds:
      name: Schedule Guard Duration
      description: Seconds to hold the schedule guard after a monitored climate or damper service call from an automation or script.
      default: 30
      selector:
        number:
          min: 1
          max: 900
          unit_of_measurement: "s"

    temperature_change_for_seconds:
      name: Temperature Change Settle Time
      description: Seconds a target-temperature change must remain before it is classified.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "s"

    mode_change_for_seconds:
      name: Mode Change Settle Time
      description: Seconds an HVAC mode change must remain before it is classified.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "s"

    state_settle_seconds:
      name: Ambiguous State Settle Time
      description: Seconds to wait before confirming an ambiguous physical/device-originated state change still matches.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "s"

triggers:
  - trigger: state
    id: temp
    entity_id: !input monitored_climate_entities
    attribute: temperature
    for:
      seconds: !input temperature_change_for_seconds

  - trigger: state
    id: mode
    entity_id: !input head_unit
    for:
      seconds: !input mode_change_for_seconds

  - trigger: state
    id: damper
    entity_id: !input damper_switches

  - trigger: event
    id: svc_climate_temp
    event_type: call_service
    event_data:
      domain: climate
      service: set_temperature

  - trigger: event
    id: svc_climate_mode
    event_type: call_service
    event_data:
      domain: climate
      service: set_hvac_mode

  - trigger: event
    id: svc_climate_on
    event_type: call_service
    event_data:
      domain: climate
      service: turn_on

  - trigger: event
    id: svc_climate_off
    event_type: call_service
    event_data:
      domain: climate
      service: turn_off

  - trigger: event
    id: svc_switch_on
    event_type: call_service
    event_data:
      domain: switch
      service: turn_on

  - trigger: event
    id: svc_switch_off
    event_type: call_service
    event_data:
      domain: switch
      service: turn_off

  - trigger: event
    id: svc_switch_toggle
    event_type: call_service
    event_data:
      domain: switch
      service: toggle

  - trigger: event
    id: svc_homeassistant_on
    event_type: call_service
    event_data:
      domain: homeassistant
      service: turn_on

  - trigger: event
    id: svc_homeassistant_off
    event_type: call_service
    event_data:
      domain: homeassistant
      service: turn_off

  - trigger: event
    id: svc_homeassistant_toggle
    event_type: call_service
    event_data:
      domain: homeassistant
      service: toggle

  - trigger: event
    id: scheduled_control
    event_type: multi_zone_climate_scheduled_control

  - trigger: event
    id: schedule_guard_finished
    event_type: timer.finished

  - trigger: event
    id: schedule_guard_cancelled
    event_type: timer.cancelled

  - trigger: event
    id: schedule_guard_paused
    event_type: timer.paused

  - trigger: state
    id: schedule_guard_idle
    entity_id: !input schedule_guard_timer
    to: "idle"

  - trigger: homeassistant
    id: homeassistant_started
    event: start

  - trigger: event
    id: automations_reloaded
    event_type: automation_reloaded

conditions: []

actions:
  - variables:
      head_entity: !input head_unit
      climate_entities: !input monitored_climate_entities
      damper_entities: !input damper_switches
      schedule_hold_seconds: !input schedule_hold_seconds
      state_settle_seconds: !input state_settle_seconds
      schedule_guard_flag_entity: !input schedule_guard_flag
      schedule_guard_timer_entity: !input schedule_guard_timer
      manual_override_entity: !input manual_override

      monitored_entities: >-
        {% set ns = namespace(ids=[]) %}
        {% if head_entity not in [none, '', []] %}
          {% set ns.ids = ns.ids + [head_entity] %}
        {% endif %}

        {% set climate_list = climate_entities if (climate_entities is sequence and climate_entities is not string) else ([climate_entities] if climate_entities not in [none, '', []] else []) %}
        {% for entity in climate_list %}
          {% if entity not in [none, '', []] and entity not in ns.ids %}
            {% set ns.ids = ns.ids + [entity] %}
          {% endif %}
        {% endfor %}

        {% set damper_list = damper_entities if (damper_entities is sequence and damper_entities is not string) else ([damper_entities] if damper_entities not in [none, '', []] else []) %}
        {% for entity in damper_list %}
          {% if entity not in [none, '', []] and entity not in ns.ids %}
            {% set ns.ids = ns.ids + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.ids }}

      is_service_event: |-
        {{ trigger.platform == 'event'
           and trigger.event is defined
           and trigger.event.event_type == 'call_service' }}

      service_targets: |-
        {% set ns = namespace(ids=[]) %}
        {% if is_service_event %}
          {% set d = trigger.event.data | default({}) %}
          {% set service_data = d.get('service_data') if d.get('service_data') is mapping else {} %}

          {% set entity_value = service_data.get('entity_id') %}
          {% set entity_ids = entity_value if (entity_value is sequence and entity_value is not string) else ([entity_value] if entity_value not in [none, ''] else []) %}
          {% if 'all' in entity_ids %}
            {% set ns.ids = ns.ids + monitored_entities %}
          {% else %}
            {% set ns.ids = ns.ids + entity_ids %}
            {# Direct entity IDs are already resolved; only groups need expansion. #}
            {% for entity in entity_ids if entity is string and entity.startswith('group.') %}
              {% for state in expand(entity) %}
                {% set ns.ids = ns.ids + [state.entity_id] %}
              {% endfor %}
            {% endfor %}
          {% endif %}

          {% set device_value = service_data.get('device_id') %}
          {% set device_ids = device_value if (device_value is sequence and device_value is not string) else ([device_value] if device_value not in [none, ''] else []) %}
          {% for device in device_ids %}
            {% set ns.ids = ns.ids + (device_entities(device) | list) %}
          {% endfor %}

          {% set area_value = service_data.get('area_id') %}
          {% set area_ids = area_value if (area_value is sequence and area_value is not string) else ([area_value] if area_value not in [none, ''] else []) %}
          {% for area in area_ids %}
            {% set ns.ids = ns.ids + (area_entities(area) | list) %}
          {% endfor %}

          {% set floor_value = service_data.get('floor_id') %}
          {% set floor_ids = floor_value if (floor_value is sequence and floor_value is not string) else ([floor_value] if floor_value not in [none, ''] else []) %}
          {% for floor in floor_ids %}
            {% set ns.ids = ns.ids + (floor_entities(floor) | list) %}
          {% endfor %}

          {% set label_value = service_data.get('label_id') %}
          {% set label_ids = label_value if (label_value is sequence and label_value is not string) else ([label_value] if label_value not in [none, ''] else []) %}
          {% for label in label_ids %}
            {% set ns.ids = ns.ids + (label_entities(label) | list) %}
            {% for device in label_devices(label) %}
              {% set ns.ids = ns.ids + (device_entities(device) | list) %}
            {% endfor %}
            {% for area in label_areas(label) %}
              {% set ns.ids = ns.ids + (area_entities(area) | list) %}
            {% endfor %}
          {% endfor %}
        {% endif %}
        {{ ns.ids | unique | list }}

      service_hits_monitored_entity: |-
        {% set service_domain = trigger.event.data.get('domain') if is_service_event else none %}
        {% set ns = namespace(hit=false) %}
        {% for entity in service_targets %}
          {% set entity_domain = entity.split('.')[0] if entity is string else none %}
          {% if entity in monitored_entities
                and (service_domain == 'homeassistant' or entity_domain == service_domain) %}
            {% set ns.hit = true %}
          {% endif %}
        {% endfor %}
        {{ ns.hit }}

      scheduled_control_targets: |-
        {% set entity_value = trigger.event.data.get('entity_id') if trigger.id == 'scheduled_control' else none %}
        {% if entity_value is string %}
          {{ [entity_value] }}
        {% elif entity_value is sequence and entity_value is not string %}
          {{ entity_value | list }}
        {% else %}
          {{ [] }}
        {% endif %}

      scheduled_control_hits_monitored_entity: >-
        {{ scheduled_control_targets | select('in', monitored_entities) | list | count > 0 }}

      schedule_guard_timer_event_matches: >-
        {{ trigger.id == 'schedule_guard_idle'
           or (
             trigger.id in ['schedule_guard_finished', 'schedule_guard_cancelled', 'schedule_guard_paused']
             and trigger.event is defined
             and trigger.event.data.get('entity_id') == schedule_guard_timer_entity
           ) }}

      schedule_guard_active: >-
        {{ is_state(schedule_guard_flag_entity, 'on')
           and is_state(schedule_guard_timer_entity, 'active') }}

      state_change_is_valid: >-
        {% if trigger.platform != 'state' or trigger.from_state is none or trigger.to_state is none %}
          false
        {% elif trigger.from_state.state in ['unavailable', 'unknown'] or trigger.to_state.state in ['unavailable', 'unknown'] %}
          false
        {% elif trigger.id == 'temp' %}
          {% set t_to = trigger.to_state.attributes.get('temperature') %}
          {% set t_fr = trigger.from_state.attributes.get('temperature') %}
          {{ t_to not in [none, 'unknown', 'unavailable']
             and t_fr not in [none, 'unknown', 'unavailable']
             and (t_to | float | round(1)) != (t_fr | float | round(1)) }}
        {% elif trigger.entity_id.startswith('climate.') %}
          {{ trigger.from_state.state != trigger.to_state.state }}
        {% elif trigger.entity_id.startswith('switch.') %}
          {{ trigger.from_state.state in ['on', 'off']
             and trigger.to_state.state in ['on', 'off']
             and trigger.from_state.state != trigger.to_state.state }}
        {% else %}
          true
        {% endif %}

      schedule_guard_duration: >-
        {% set total = schedule_hold_seconds | int(30) %}
        {{ '%02d:%02d:%02d' | format(total // 3600, (total % 3600) // 60, total % 60) }}

  - choose:
      - conditions:
          - alias: Schedule guard timer stopped
            condition: template
            value_template: |-
              {{ schedule_guard_timer_event_matches
                 and not is_state(schedule_guard_timer_entity, 'active') }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input schedule_guard_flag

      - conditions:
          - alias: Reconcile the guard after Home Assistant or automations restart
            condition: template
            value_template: |-
              {{ trigger.id in ['homeassistant_started', 'automations_reloaded'] }}
        sequence:
          - choose:
              - conditions: "{{ is_state(schedule_guard_timer_entity, 'active') }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input schedule_guard_flag
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: !input schedule_guard_flag

      - conditions:
          - alias: Companion schedule announced a monitored control call
            condition: template
            value_template: |-
              {{ trigger.id == 'scheduled_control'
                 and scheduled_control_hits_monitored_entity }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input schedule_guard_flag
          - action: timer.start
            target:
              entity_id: !input schedule_guard_timer
            data:
              duration: "{{ schedule_guard_duration }}"

      - conditions:
          - alias: Automation or script called a monitored climate or damper service
            condition: template
            value_template: |-
              {{ is_service_event
                 and service_hits_monitored_entity
                 and trigger.event.context is not none
                 and trigger.event.context.user_id is none
                 and trigger.event.context.parent_id is not none }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input schedule_guard_flag
          - action: timer.start
            target:
              entity_id: !input schedule_guard_timer
            data:
              duration: "{{ schedule_guard_duration }}"

      - conditions:
          - alias: State change clearly initiated by a HA user context
            condition: template
            value_template: |-
              {{ trigger.platform == 'state'
                 and trigger.to_state is not none
                 and trigger.to_state.context is not none
                 and trigger.to_state.context.user_id is not none }}
          - alias: Ignore unavailable, unknown and non-change updates
            condition: template
            value_template: "{{ state_change_is_valid }}"
          - condition: state
            entity_id: !input manual_override
            state: "off"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input manual_override

      - conditions:
          - alias: State change came from an automation or script chain
            condition: template
            value_template: |-
              {{ trigger.platform == 'state'
                 and trigger.to_state is not none
                 and trigger.to_state.context is not none
                 and trigger.to_state.context.user_id is none
                 and trigger.to_state.context.parent_id is not none }}
          - alias: Ignore unavailable, unknown and non-change updates
            condition: template
            value_template: "{{ state_change_is_valid }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input schedule_guard_flag
          - action: timer.start
            target:
              entity_id: !input schedule_guard_timer
            data:
              duration: "{{ schedule_guard_duration }}"

      - conditions:
          - alias: Ambiguous direct state change, likely HomeKit/physical/device-originated
            condition: template
            value_template: |-
              {{ trigger.platform == 'state'
                 and trigger.to_state is not none
                 and trigger.to_state.context is not none
                 and trigger.to_state.context.user_id is none
                 and trigger.to_state.context.parent_id is none }}
          - alias: Ignore unavailable, unknown and non-change updates
            condition: template
            value_template: "{{ state_change_is_valid }}"
          - alias: Do not treat known schedule windows as manual
            condition: template
            value_template: "{{ not (schedule_guard_active | bool) }}"
          - condition: state
            entity_id: !input manual_override
            state: "off"
        sequence:
          - delay:
              seconds: "{{ state_settle_seconds }}"
          - alias: Recheck the live schedule guard after settling
            condition: template
            value_template: |-
              {{ not (
                is_state(schedule_guard_flag_entity, 'on')
                and is_state(schedule_guard_timer_entity, 'active')
              ) }}
          - alias: Confirm the live entity state still matches the triggering change
            condition: template
            value_template: |-
              {% if trigger.platform != 'state' or trigger.to_state is none %}
                false
              {% elif trigger.id == 'temp' %}
                {% set live = state_attr(trigger.entity_id, 'temperature') %}
                {% set expected = trigger.to_state.attributes.get('temperature') %}
                {{ live is not none and expected is not none
                   and (live | float | round(1)) == (expected | float | round(1)) }}
              {% else %}
                {{ states(trigger.entity_id) == trigger.to_state.state }}
              {% endif %}
          - action: input_boolean.turn_on
            target:
              entity_id: !input manual_override

mode: parallel
# Service calls and their resulting state changes can arrive in the same burst.
max: 50
